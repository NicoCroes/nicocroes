    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser''t cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    <script type="module" crossorigin src="/nicocroes/assets/index-DUI5KOtE.js"></script>
    <link rel="stylesheet" crossorigin href="/nicocroes/assets/index-BYkIB1Xh.css">
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background-image: linear-gradient(to bottom, white, #c0c0c0);
        color: #0c2e62;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: system-ui, sans-serif;
        z-index: 9999;
        transition: opacity 500ms ease;
      }

      #initial-loader.fade-out {
        opacity: 0;
      }

      .spinner {
        width: 64px;
        height: 64px;
        border-radius: 9999px;
        border: 2px solid #0c2e6214;
        border-top-color: #0c2e62;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </body>
</html>
