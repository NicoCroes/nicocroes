# Compila y publica la página en GitHub Pages (rama gh-pages)
# cada vez que hay cambios en la rama main.
# Si la compilación falla, no se publica nada y la página en línea no cambia.
name: Publicar página

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: nicocroes.com
          commit_message: "Publicación automática"
